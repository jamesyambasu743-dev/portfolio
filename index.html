<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James Yambasu</title>
<meta name="description" content="Survey researcher and data analyst based in Freetown, Sierra Leone. Survey design, KoboToolbox auditing, data cleaning and public health data systems.">
<meta name="theme-color" content="#F4F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============================ tokens ============================ */

:root{
  color-scheme: light;
  --paper:      #F4F5F0;
  --surface:    #FFFFFF;
  --surface-2:  #ECEEE6;
  --line:       #D9DBCF;
  --line-soft:  #E6E8DE;
  --ink:        #171B26;
  --ink-soft:   #4A4E58;
  --ink-mute:   #6E727C;
  --gold:       #8C6317;
  --green:      #2E5F49;
  --accent:     #2E5F49;
  --ok:         #0ca30c;
  --bad:        #d03b3b;
  --max: 940px;
  --shadow: 0 1px 2px rgba(23,27,38,.05), 0 8px 24px -16px rgba(23,27,38,.25);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:     #14161A;
    --surface:   #1B1E24;
    --surface-2: #232730;
    --line:      #2E333D;
    --line-soft: #262A33;
    --ink:       #EDEEEA;
    --ink-soft:  #B4B8C0;
    --ink-mute:  #8B909A;
    --gold:      #D7A64A;
    --green:     #7FC9A5;
    --accent:    #7FC9A5;
    --ok:        #4ec24e;
    --bad:       #ef7676;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:     #14161A;
  --surface:   #1B1E24;
  --surface-2: #232730;
  --line:      #2E333D;
  --line-soft: #262A33;
  --ink:       #EDEEEA;
  --ink-soft:  #B4B8C0;
  --ink-mute:  #8B909A;
  --gold:      #D7A64A;
  --green:     #7FC9A5;
  --accent:    #7FC9A5;
  --ok:        #4ec24e;
  --bad:       #ef7676;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

/* ============================ base ============================ */

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }

body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3{ font-family:'Fraunces', Georgia, serif; font-weight:500; line-height:1.15; margin:0; }
a{ color: var(--ink); }
img{ max-width:100%; display:block; }

.wrap{ max-width: var(--max); margin:0 auto; padding: 0 28px; }

.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.skip{
  position:absolute; left:-9999px; top:0; background:var(--surface);
  padding:10px 16px; z-index:100; border:1px solid var(--line);
}
.skip:focus{ left:12px; top:12px; }

/* ============================ nav ============================ */

header{
  position: sticky; top:0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.nav-inner{
  max-width: var(--max); margin:0 auto; padding: 14px 28px;
  display:flex; justify-content: space-between; align-items:center; gap:16px;
}

.nav-name{ font-family:'Fraunces', serif; font-size:18px; font-weight:500; text-decoration:none; color:var(--ink); white-space:nowrap; }

nav ul{ list-style:none; display:flex; gap:20px; margin:0; padding:0; }
nav a{ text-decoration:none; font-size:14px; color:var(--ink-soft); }
nav a:hover{ color:var(--ink); }

.nav-tools{ display:flex; align-items:center; gap:10px; }

.btn{
  font: inherit; font-size:13.5px; line-height:1;
  padding: 9px 14px; border-radius: 999px;
  border:1px solid var(--line); background: var(--surface); color: var(--ink);
  text-decoration:none; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{ border-color: var(--ink-mute); }
.btn-solid{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-solid:hover{ opacity:.88; }
.btn-icon{ padding:9px; border-radius:999px; }

@media (max-width: 860px){ nav{ display:none; } }
@media (max-width: 420px){ .nav-cv-text{ display:none; } }

/* ============================ hero ============================ */

.hero{
  padding: 76px 0 52px;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: center top;
  -webkit-mask-image: linear-gradient(to bottom, black 0%, black 62%, transparent 100%);
  mask-image: linear-gradient(to bottom, black 0%, black 62%, transparent 100%);
}

.hero-inner{ max-width: var(--max); margin:0 auto; padding:0 28px; }

.hero-grid{ display:grid; grid-template-columns: 1fr; gap: 32px; align-items:start; }
.hero-grid.has-photo{ grid-template-columns: minmax(0,1fr) 176px; }
@media (max-width: 700px){ .hero-grid.has-photo{ grid-template-columns: 1fr; } }

.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.06em;
  text-transform: uppercase; color: var(--green); margin-bottom:16px;
}

.hero h1{ font-size: clamp(31px, 5.4vw, 50px); max-width: 15ch; letter-spacing:-0.015em; }
.hero-sub{ margin-top:20px; max-width:58ch; color:var(--ink-soft); }

.hero-cta{ display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }

.headshot{
  width:176px; height:176px; border-radius: 4px; object-fit: cover;
  border:1px solid var(--line); box-shadow: var(--shadow);
}
@media (max-width: 700px){ .headshot{ width:120px; height:120px; } }

.stat-row{ display:flex; gap:36px; margin-top:44px; flex-wrap:wrap; }
.stat{ max-width:190px; }
.stat-num{ font-family:'Fraunces', serif; font-size:34px; color:var(--gold); line-height:1; }
.stat-label{ font-size:13px; color:var(--ink-soft); margin-top:8px; }

/* ============================ sections ============================ */

section{ padding: 56px 0; border-top:1px solid var(--line); }

.section-head{
  font-size:12.5px; font-family:'IBM Plex Mono', monospace; letter-spacing:.06em;
  text-transform: uppercase; color:var(--ink-mute); margin-bottom:26px;
}

.section-intro{ color:var(--ink-soft); max-width:64ch; margin: -10px 0 26px; }

.about p{ margin:0 0 18px; max-width:64ch; color:var(--ink-soft); }
.about p:last-child{ margin-bottom:0; }

/* ---------- cleaning panel ---------- */

.tabs{ display:inline-flex; padding:3px; background:var(--surface-2); border-radius:999px; border:1px solid var(--line); margin-bottom:18px; }
.tab{
  font:inherit; font-size:13.5px; padding:7px 16px; border:0; border-radius:999px;
  background:transparent; color:var(--ink-soft); cursor:pointer;
}
.tab[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow: var(--shadow); }

.table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:4px; background:var(--surface); }

table.data{ border-collapse:collapse; width:100%; font-family:'IBM Plex Mono', monospace; font-size:12.5px; white-space:nowrap; }
table.data th, table.data td{ padding:9px 13px; text-align:left; border-bottom:1px solid var(--line-soft); }
table.data th{ color:var(--ink-mute); font-weight:500; background:var(--surface-2); position:sticky; top:0; }
table.data tr:last-child td{ border-bottom:0; }
td.flag{ color:var(--bad); }
td.flag::after{ content:" \u25B2"; font-size:9px; vertical-align:2px; }
td.fixed{ color:var(--ok); }
td.miss{ color:var(--ink-mute); font-style:italic; }

.legend-row{ display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; font-size:12.5px; color:var(--ink-mute); }
.legend-row span{ display:inline-flex; align-items:center; gap:6px; }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

.faults{ display:grid; grid-template-columns: repeat(auto-fit, minmax(270px,1fr)); gap:2px; margin-top:28px; }
.fault{ padding:18px 20px; background:var(--surface); border:1px solid var(--line); border-radius:3px; }
.fault h4{ margin:0 0 5px; font-size:14px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; }
.fault p{ margin:0; font-size:14.5px; color:var(--ink-soft); line-height:1.5; }

.note{ font-size:12.5px; color:var(--ink-mute); margin-top:14px; }

/* ---------- chart ---------- */

.chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:22px 20px 14px; box-shadow:var(--shadow); }
.chart-title{ font-size:15px; font-weight:600; margin:0 0 2px; font-family:'IBM Plex Sans',sans-serif; }
.chart-sub{ font-size:13px; color:var(--ink-mute); margin:0 0 16px; }
.chart-holder{ position:relative; }
svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
.tip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--ink); color:var(--paper); font-family:'IBM Plex Mono',monospace;
  font-size:11.5px; padding:6px 9px; border-radius:3px; white-space:nowrap; transform:translate(-50%,-140%);
  z-index:5;
}
.chart-note{ font-size:13px; color:var(--ink-soft); margin:14px 0 0; }
details.tablekit{ margin-top:14px; }
details.tablekit summary{ font-size:13px; color:var(--ink-mute); cursor:pointer; }

/* ---------- case studies ---------- */

.case{ background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:26px; box-shadow:var(--shadow); }
.case + .case{ margin-top:18px; }
.case-meta{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green); margin-bottom:8px; }
.case h3{ font-size:21px; max-width:28ch; }
.case-metrics{ display:flex; gap:28px; flex-wrap:wrap; margin:20px 0 22px; padding:16px 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
.case-metrics .stat-num{ font-size:26px; }
.case-label{ font-size:12.5px; font-family:'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-mute); margin:0 0 6px; }
.case p{ margin:0 0 18px; color:var(--ink-soft); max-width:66ch; font-size:15.5px; }
.case ul{ margin:0 0 18px; padding-left:18px; color:var(--ink-soft); font-size:15.5px; max-width:66ch; }
.case li{ margin-bottom:7px; }
.case li::marker{ color:var(--gold); }
.case .result{ color:var(--ink); }

/* ---------- focus / skills ---------- */

.focus-list{ display:flex; flex-direction:column; }
.focus-item{ padding:22px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 2fr; gap:18px; }
.focus-item:first-child{ border-top:none; }
.focus-item h3{ font-size:19px; }
.focus-item p{ margin:0; color:var(--ink-soft); font-size:15.5px; }
@media (max-width:600px){ .focus-item{ grid-template-columns:1fr; gap:6px; } }

.skill-group{ display:grid; grid-template-columns: 130px 1fr; gap:16px; padding:16px 0; border-top:1px solid var(--line-soft); }
.skill-group:first-child{ border-top:0; padding-top:0; }
.skill-group-label{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-mute); padding-top:6px; }
.skill-list{ display:flex; flex-wrap:wrap; gap:8px; }
.skill-tag{ font-size:13.5px; padding:6px 13px; border:1px solid var(--line); border-radius:20px; color:var(--ink-soft); background:var(--surface); }
@media (max-width:600px){ .skill-group{ grid-template-columns:1fr; gap:8px; } }

/* ---------- timeline ---------- */

.timeline{ position:relative; padding-left:22px; border-left:1px solid var(--line); }
.tl-item{ position:relative; padding-bottom:30px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-item::before{ content:""; position:absolute; left:-26px; top:7px; width:8px; height:8px; border-radius:50%; background:var(--gold); }
.tl-period{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--green); margin-bottom:5px; }
.tl-item h3{ font-size:18px; }
.tl-org{ font-size:14px; color:var(--ink-soft); margin:3px 0 8px; }
.tl-item p{ margin:0; color:var(--ink-soft); font-size:15px; max-width:60ch; }

/* ---------- projects / gallery / wins ---------- */

.proj-item{ padding:18px 20px; background:var(--surface); border:1px solid var(--line); border-radius:3px; }
.proj-item + .proj-item{ margin-top:10px; }
.proj-item h3{ font-size:16.5px; }
.proj-item p{ margin:6px 0 0; color:var(--ink-soft); font-size:15px; }

.gallery{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:14px; }
.gallery figure{ margin:0; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--surface); }
.gallery img{ width:100%; aspect-ratio: 16/10; object-fit:cover; border-bottom:1px solid var(--line); }
.gallery figcaption{ font-size:13px; color:var(--ink-soft); padding:11px 14px; }

.win-item{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:14px 0; border-top:1px solid var(--line); }
.win-item:first-child{ border-top:none; }
.win-left{ display:flex; align-items:baseline; gap:12px; }
.win-rank{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--gold); white-space:nowrap; }
.win-title{ font-size:15.5px; }
.win-amount{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--green); white-space:nowrap; }

/* ---------- contact ---------- */

.contact-text{ color:var(--ink-soft); max-width:56ch; margin:0 0 26px; }
.contact-links a{ text-decoration:none; font-size:16px; display:flex; justify-content:space-between; gap:14px; border-top:1px solid var(--line); padding:14px 0; }
.contact-links a:hover{ color:var(--green); }
.contact-links a span:last-child{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; }

footer{ padding:28px 0 48px; font-size:13px; color:var(--ink-mute); border-top:1px solid var(--line); }

/* ---------- reveal ---------- */

.reveal{ opacity:0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
.reveal.in{ opacity:1; transform:none; }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  .reveal{ opacity:1; transform:none; transition:none; }
  *{ animation:none !important; }
}

@media print{
  header, .nav-tools, .hero{ break-inside: avoid; }
  .reveal{ opacity:1; transform:none; }
}

</style>
</head>

<header>
  <div class="nav-inner">

      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#cleaning">Cleaning</a></li>
        <li><a href="#cases">Case studies</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-tools">
      <button class="btn btn-icon" id="theme-btn" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>

      <a class="btn btn-solid" id="cv-btn" href="#" download>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>

<div id="top"></div>

<main id="main">

<section class="hero" style="border-top:none;">
  <div class="hero-inner">
    <div class="hero-grid" id="hero-grid">
      <div>
        <div class="eyebrow" id="hero-eyebrow"></div>
        <h1 id="hero-heading"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-cta" id="hero-cta"></div>

<section id="cases" class="reveal">

  </div>
</section>

    <div class="section-head" id="focus-head"></div>

<section id="skills" class="reveal">
  <div class="wrap">
    <div class="section-head" id="skills-head"></div>

<section id="education" class="reveal">

</main>

<footer><div class="wrap" id="footer-text"></div></footer>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var C = CONTENT;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function setText(id, t) { var n = $(id); if (n) n.textContent = t || ''; }

  /* ---------------- theme ---------------- */

  var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = prefersDark ? 'dark' : 'light';

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    var dark = theme === 'dark';
    $('theme-icon').innerHTML = dark ? SUN : MOON;
    $('theme-btn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#14161A' : '#F4F5F0');
    drawChart();
  }
  $('theme-btn').addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    // To remember the choice between visits, uncomment the next line:
    // try { localStorage.setItem('theme', theme); } catch (e) {}
  });

  /* ---------------- head + hero ---------------- */

  document.title = C.name + ' \u2014 ' + C.role;
  setText('nav-name', C.name);

  var cv = $('cv-btn');
  if (C.images && C.images.resume) { cv.href = C.images.resume; }
  else { cv.style.display = 'none'; }

  setText('hero-eyebrow', C.tagline);
  setText('hero-heading', C.hero.heading);
  setText('hero-sub', C.hero.sub);

  if (C.images && C.images.headshot) {
    var img = el('img', 'headshot');
    img.src = C.images.headshot;
    img.alt = C.images.headshotAlt || C.name;
    img.loading = 'lazy';
    img.onerror = function () { this.remove(); $('hero-grid').classList.remove('has-photo'); };
    $('hero-grid').classList.add('has-photo');
    $('hero-grid').appendChild(img);
  }

  var cta = $('hero-cta');
  var mail = el('a', 'btn btn-solid', 'Work with me');
  mail.href = 'mailto:' + C.contact.email;
  cta.appendChild(mail);
  if (C.images && C.images.resume) {
    var dl = el('a', 'btn', 'Download CV');
    dl.href = C.images.resume; dl.setAttribute('download', '');
    cta.appendChild(dl);
  }
  var l2e = (C.contact.links || []).filter(function (l) { return /learn2earn/i.test(l.label); })[0];
  if (l2e) {
    var a = el('a', 'btn', 'Learn2Earn profile');
    a.href = l2e.href; a.target = '_blank'; a.rel = 'noopener';
    cta.appendChild(a);
  }

  var statsEl = $('hero-stats');
  C.hero.stats.forEach(function (s) {
    var d = el('div', 'stat');
    d.appendChild(el('div', 'stat-num', s.number));
    d.appendChild(el('div', 'stat-label', s.label));
    statsEl.appendChild(d);
  });

  /* ---------------- about ---------------- */

  setText('about-head', C.about.heading);
  C.about.paragraphs.forEach(function (t) { $('about-body').appendChild(el('p', null, t)); });

  /* ---------------- cleaning panel ---------------- */

  var CL = C.cleaning;
  setText('cleaning-head', CL.heading);
  setText('cleaning-intro', CL.intro);
  setText('clean-note', CL.note);

  var headRow = el('tr');
  CL.columns.forEach(function (c) { headRow.appendChild(el('th', null, c)); });
  $('clean-head').appendChild(headRow);

  // Cells worth marking in the raw view: anything blank, "N/A", or a
  // duplicate key. Marked with colour AND a glyph, never colour alone.
  function isBad(v, colIdx, rowIdx) {
    var s = String(v);
    if (s.trim() === '' || s.trim() === 'N/A') return true;
    if (colIdx === 0 && rowIdx === 2) return true;             // duplicate _id
    if (colIdx === 1) return s !== 'Western Area Rural' && s !== 'Western Area Urban';
    if (colIdx === 2) return !/^\d{4}-\d{2}-\d{2}$/.test(s);
    if (colIdx === 3 || colIdx === 5) return !/^\d+$/.test(s);
    if (colIdx === 4) return s !== 'Retail' && s !== 'Tailoring';
    if (colIdx === 6) return !/^\+\d+$/.test(s);
    return false;
  }

  function renderRows(which) {
    var rows = CL[which], tb = $('clean-body');
    tb.innerHTML = '';
    rows.forEach(function (r, ri) {
      var tr = el('tr');
      r.forEach(function (v, ci) {
        var shown = String(v).trim() === '' ? '(blank)' : String(v);
        var td = el('td', null, shown);
        if (which === 'before') {
          if (isBad(v, ci, ri)) td.className = 'flag';
        } else if (shown === '\u2014') {
          td.className = 'miss';
        } else if (String(CL.before[ri][ci]) !== String(v)) {
          td.className = 'fixed';           // green marks only what actually changed
        }
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    $('clean-legend').innerHTML = which === 'before'
      ? '<span><i class="dot" style="background:var(--bad)"></i>\u25B2 needs fixing</span><span>5 rows shown of 132</span>'
      : '<span><i class="dot" style="background:var(--ok)"></i>cleaned &amp; typed</span><span><i class="dot" style="background:var(--ink-mute)"></i>\u2014 missing, flagged not invented</span>';
  }

  function selectTab(which) {
    $('tab-before').setAttribute('aria-selected', String(which === 'before'));
    $('tab-after').setAttribute('aria-selected', String(which === 'after'));
    renderRows(which);
  }
  $('tab-before').addEventListener('click', function () { selectTab('before'); });
  $('tab-after').addEventListener('click', function () { selectTab('after'); });
  selectTab('before');

  CL.faults.forEach(function (f) {
    var d = el('div', 'fault');
    d.appendChild(el('h4', null, f.label));
    d.appendChild(el('p', null, f.text));
    $('clean-faults').appendChild(d);
  });

  /* ---------------- chart ---------------- */

  var CH = C.chart;
  setText('chart-head', 'Selected analysis');
  setText('chart-title', CH.heading);
  setText('chart-sub', CH.caption);
  setText('chart-note', CH.annotation);
  $('chart-a11y').textContent = CH.heading + '. ' + CH.series + ' rising from ' +
    CH.data[0].y + ' to ' + CH.data[CH.data.length - 1].y + ' ' + CH.yLabel +
    ' over ' + CH.data.length + ' weeks.';

  var ctab = $('chart-table');
  ctab.innerHTML = '<thead><tr><th>' + CH.xLabel + '</th><th>' + CH.yLabel + '</th></tr></thead><tbody>' +
    CH.data.map(function (p) { return '<tr><td>' + p.x + '</td><td>' + p.y.toFixed(1) + '</td></tr>'; }).join('') +
    '</tbody>';

  var NS = 'http://www.w3.org/2000/svg';
  function svgEl(t, attrs) {
    var n = document.createElementNS(NS, t);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function drawChart() {
    var svg = $('chart-svg');
    if (!svg) return;
    var cs = getComputedStyle(document.documentElement);
    var accent = cs.getPropertyValue('--accent').trim() || '#2E5F49';
    var grid = cs.getPropertyValue('--line-soft').trim() || '#E6E8DE';
    var mute = cs.getPropertyValue('--ink-mute').trim() || '#6E727C';
    var surf = cs.getPropertyValue('--surface').trim() || '#fff';

    var W = 760, H = 310, m = { t: 30, r: 50, b: 44, l: 42 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var xs = CH.data.map(function (d) { return d.x; });
    var ys = CH.data.map(function (d) { return d.y; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var yMax = Math.ceil(Math.max.apply(null, ys) / 10) * 10;

    var X = function (v) { return m.l + (v - xMin) / (xMax - xMin) * iw; };
    var Y = function (v) { return m.t + ih - (v / yMax) * ih; };

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);

    // recessive horizontal grid + y ticks
    var step = yMax / 4;
    for (var v = 0; v <= yMax; v += step) {
      svg.appendChild(svgEl('line', { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: grid, 'stroke-width': 1 }));
      var yl = svgEl('text', { x: m.l - 10, y: Y(v) + 4, fill: mute, 'font-size': 11, 'text-anchor': 'end', 'font-family': 'IBM Plex Mono, monospace' });
      yl.textContent = v;
      svg.appendChild(yl);
    }
    // x ticks
    CH.data.forEach(function (d) {
      if (d.x % 2 !== 0 && d.x !== xMin) return;
      var t = svgEl('text', { x: X(d.x), y: m.t + ih + 19, fill: mute, 'font-size': 11, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono, monospace' });
      t.textContent = d.x;
      svg.appendChild(t);
    });
    var ax = svgEl('text', { x: m.l + iw / 2, y: H - 4, fill: mute, 'font-size': 11, 'text-anchor': 'middle', 'font-family': 'IBM Plex Mono, monospace' });
    ax.textContent = CH.xLabel;
    svg.appendChild(ax);
    var ayl = svgEl('text', { x: 0, y: 11, fill: mute, 'font-size': 11, 'text-anchor': 'start', 'font-family': 'IBM Plex Mono, monospace' });
    ayl.textContent = CH.yLabel;
    svg.appendChild(ayl);

    // soft area under the line
    var area = 'M' + X(CH.data[0].x) + ',' + Y(0) + CH.data.map(function (d) { return 'L' + X(d.x) + ',' + Y(d.y); }).join('') +
      'L' + X(CH.data[CH.data.length - 1].x) + ',' + Y(0) + 'Z';
    svg.appendChild(svgEl('path', { d: area, fill: accent, opacity: .09 }));

    // 2px line
    var line = 'M' + CH.data.map(function (d) { return X(d.x) + ',' + Y(d.y); }).join('L');
    svg.appendChild(svgEl('path', { d: line, fill: 'none', stroke: accent, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    // markers with a 2px surface ring
    CH.data.forEach(function (d) {
      svg.appendChild(svgEl('circle', { cx: X(d.x), cy: Y(d.y), r: 4, fill: accent, stroke: surf, 'stroke-width': 2 }));
    });

    // direct label on the final point only
    var last = CH.data[CH.data.length - 1];
    var lbl = svgEl('text', { x: X(last.x) + 10, y: Y(last.y) + 4, fill: mute, 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace' });
    lbl.textContent = last.y.toFixed(1);
    svg.appendChild(lbl);

    // hover crosshair + generous hit targets
    var cross = svgEl('line', { y1: m.t, y2: m.t + ih, stroke: mute, 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 });
    svg.appendChild(cross);
    var tip = $('chart-tip');

    CH.data.forEach(function (d) {
      var hit = svgEl('rect', { x: X(d.x) - iw / (CH.data.length * 2), y: m.t, width: iw / CH.data.length, height: ih, fill: 'transparent' });
      hit.style.cursor = 'crosshair';
      hit.addEventListener('mouseenter', function () {
        cross.setAttribute('x1', X(d.x)); cross.setAttribute('x2', X(d.x)); cross.setAttribute('opacity', .55);
        tip.textContent = CH.xLabel + ' ' + d.x + ' \u00b7 ' + d.y.toFixed(1) + ' cm';
        tip.style.left = (X(d.x) / W * 100) + '%';
        tip.style.top = (Y(d.y) / H * 100) + '%';
        tip.style.opacity = 1;
      });
      svg.appendChild(hit);
    });
    svg.addEventListener('mouseleave', function () { cross.setAttribute('opacity', 0); tip.style.opacity = 0; });
  }

  /* ---------------- case studies ---------------- */

  setText('cases-head', C.cases.heading);
  C.cases.items.forEach(function (it) {
    var d = el('article', 'case');
    d.appendChild(el('div', 'case-meta', it.org + '  \u00b7  ' + it.period));
    d.appendChild(el('h3', null, it.title));

    if (it.metrics && it.metrics.length) {
      var mrow = el('div', 'case-metrics');
      it.metrics.forEach(function (mm) {
        var s = el('div', 'stat');
        s.appendChild(el('div', 'stat-num', mm.number));
        s.appendChild(el('div', 'stat-label', mm.label));
        mrow.appendChild(s);
      });
      d.appendChild(mrow);
    }

    d.appendChild(el('p', 'case-label', 'The problem'));
    d.appendChild(el('p', null, it.problem));
    d.appendChild(el('p', 'case-label', 'What I did'));
    var ul = el('ul');
    it.approach.forEach(function (a) { ul.appendChild(el('li', null, a)); });
    d.appendChild(ul);
    d.appendChild(el('p', 'case-label', 'The result'));
    var r = el('p', 'result', it.result);
    r.style.marginBottom = '0';
    d.appendChild(r);

    $('cases-body').appendChild(d);
  });

  /* ---------------- focus / skills ---------------- */

  setText('focus-head', C.focus.heading);
  C.focus.areas.forEach(function (a) {
    var d = el('div', 'focus-item');
    d.appendChild(el('h3', null, a.title));
    d.appendChild(el('p', null, a.text));
    $('focus-body').appendChild(d);
  });

  setText('skills-head', C.skills.heading);
  C.skills.groups.forEach(function (g) {
    var row = el('div', 'skill-group');
    row.appendChild(el('div', 'skill-group-label', g.label));
    var list = el('div', 'skill-list');
    g.items.forEach(function (s) { list.appendChild(el('div', 'skill-tag', s)); });
    row.appendChild(list);
    $('skills-body').appendChild(row);
  });

  /* ---------------- timelines ---------------- */

  function timeline(target, items) {
    items.forEach(function (it) {
      var d = el('div', 'tl-item');
      d.appendChild(el('div', 'tl-period', it.period));
      d.appendChild(el('h3', null, it.title));
      d.appendChild(el('div', 'tl-org', it.org));
      d.appendChild(el('p', null, it.text));
      target.appendChild(d);
    });
  }
  setText('experience-head', C.experience.heading);
  timeline($('experience-body'), C.experience.items);
  setText('education-head', C.education.heading);
  timeline($('education-body'), C.education.items);

  /* ---------------- gallery ---------------- */

  if (C.gallery && C.gallery.items && C.gallery.items.length) {
    $('gallery-section').hidden = false;
    setText('gallery-head', C.gallery.heading);
    setText('gallery-note', C.gallery.note);
    C.gallery.items.forEach(function (g) {
      var fig = el('figure');
      var im = el('img');
      im.src = g.src; im.alt = g.alt || ''; im.loading = 'lazy';
      im.onerror = function () { fig.remove(); };
      fig.appendChild(im);
      if (g.caption) fig.appendChild(el('figcaption', null, g.caption));
      $('gallery-body').appendChild(fig);
    });
  }

  /* ---------------- projects, wins, contact ---------------- */

  setText('projects-head', C.projects.heading);
  C.projects.items.forEach(function (it) {
    var d = el('div', 'proj-item');
    d.appendChild(el('h3', null, it.title));
    d.appendChild(el('p', null, it.text));
    $('projects-body').appendChild(d);
  });

  setText('wins-head', C.wins.heading);
  setText('wins-note', C.wins.note);
  C.wins.items.forEach(function (w) {
    var d = el('div', 'win-item');
    var left = el('div', 'win-left');
    left.appendChild(el('span', 'win-rank', w.rank));
    left.appendChild(el('span', 'win-title', w.title));
    d.appendChild(left);
    d.appendChild(el('span', 'win-amount', w.amount));
    $('wins-body').appendChild(d);
  });

  setText('contact-head', C.contact.heading);
  setText('contact-text', C.contact.text);
  C.contact.links.forEach(function (l) {
    var a = el('a');
    a.href = l.href;
    if (l.href.indexOf('mailto:') !== 0) { a.target = '_blank'; a.rel = 'noopener'; }
    a.appendChild(el('span', null, l.label));
    a.appendChild(el('span', null, l.value));
    $('contact-links').appendChild(a);
  });

  setText('footer-text', C.name + ' \u2014 ' + C.role + ' \u2014 updated ' + new Date().getFullYear());

  /* ---------------- reveal on scroll ---------------- */

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -60px 0px' });
    document.querySelectorAll('.reveal').forEach(function (n) { io.observe(n); });
  } else {
    document.querySelectorAll('.reveal').forEach(function (n) { n.classList.add('in'); });
  }

  applyTheme();
  window.addEventListener('resize', drawChart);
})();
</script>

</body>
</html>
